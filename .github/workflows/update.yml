name: Actualizar ESTAFA
# Descarga los datos y los guarda en el repositorio. La web la publica Netlify (netlify.toml)
# cada vez que cambia el repositorio, así que aquí no se publica nada.

on:
  schedule:
    - cron: "23 9 */3 * *"   # cada 3 días (los días 1, 4, 7… de cada mes), a las 9:23 UTC (2:23 hora del servidor de eRepublik)
  workflow_dispatch: {}       # botón "Run workflow" para lanzarlo a mano
  push:                       # si cambias torneos.json o los scripts, se regenera site/data/sh.js
    branches: [main]
    paths: ["scripts/**", "data/**"]

permissions:
  contents: write

concurrency:
  group: estafa
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar SH de España
        if: github.event_name != 'push'
        run: python scripts/fetch_sh.py
      - name: Descargar BH y CH semanales
        if: github.event_name != 'push'
        continue-on-error: true   # si falla, se guardan igual las SH
        run: python scripts/fetch_players.py
      - name: Unir al histórico y generar datos
        run: python scripts/build.py
      - name: Guardar histórico si hay cambios
        run: |
          git config user.name "estafa-bot"
          git config user.email "estafa-bot@users.noreply.github.com"
          git add data site/data/sh.js   # data/raw está en .gitignore
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
