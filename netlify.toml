# Netlify: publicar solo la web (site/), sin compilar nada.
# Los datos los genera el robot de GitHub Actions y los sube al repositorio cada 3 días.
[build]
  publish = "site"
  command = ""
  # Solo se publica si el último commit cambia algo dentro de site/ o este archivo (ahorra créditos de Netlify):
  # editar torneos.json, scripts o documentación no publica; lo hace el commit del robot que regenera site/data/sh.js.
  # Se compara con el commit anterior (HEAD^) y no con $CACHED_COMMIT_REF: tras quedarse sin créditos, Netlify
  # daba por publicado lo que no lo estaba y se saltaba todo (25 nov 2026).
  ignore = "git diff --quiet HEAD^ HEAD -- site/ netlify.toml"
